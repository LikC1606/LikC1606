<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Zhenhao Liu · Research agents · AI for science</title>
  <desc id="banner-desc">A dark midnight-blue banner featuring a sculptural, dimensional wave of luminous cyan and ice-blue light strands flowing across the right side, with bold modern typography on the left.</desc>
  <defs>
    <clipPath id="corners">
      <rect width="1600" height="500" rx="18" ry="18" />
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03060c" />
      <stop offset="45%" stop-color="#050a14" />
      <stop offset="80%" stop-color="#071224" />
      <stop offset="100%" stop-color="#040811" />
    </linearGradient>

    <radialGradient id="ambient-glow" cx="0.74" cy="0.48" r="0.42" fx="0.68" fy="0.42">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#00509d" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#050a14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="core-flare" cx="0.67" cy="0.42" r="0.24">
      <stop offset="0%" stop-color="#adf0ff" stop-opacity="0.20" />
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="left-vignette" x1="0" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03060c" stop-opacity="1" />
      <stop offset="60%" stop-color="#040811" stop-opacity="0.98" />
      <stop offset="73%" stop-color="#040811" stop-opacity="0.87" />
      <stop offset="87%" stop-color="#050a14" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050a14" stop-opacity="0" />
    </linearGradient>

    <!-- Ribbon Body Fill Gradients -->
    <linearGradient id="veil1" x1="550" y1="450" x2="1550" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050a14" stop-opacity="0" />
      <stop offset="20%" stop-color="#0a3663" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#00a8e8" stop-opacity="0.24" />
      <stop offset="70%" stop-color="#0077b6" stop-opacity="0.14" />
      <stop offset="95%" stop-color="#48cae4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#90e0ef" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="veil2" x1="600" y1="50" x2="1580" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050a14" stop-opacity="0" />
      <stop offset="28%" stop-color="#0096c7" stop-opacity="0.15" />
      <stop offset="55%" stop-color="#48cae4" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#023e8a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filament Stroke Gradients -->
    <linearGradient id="strand-deep" x1="450" y1="300" x2="1600" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071b33" stop-opacity="0" />
      <stop offset="12%" stop-color="#0d3b66" stop-opacity="0.35" />
      <stop offset="42%" stop-color="#0077b6" stop-opacity="0.65" />
      <stop offset="72%" stop-color="#023e8a" stop-opacity="0.4" />
      <stop offset="92%" stop-color="#0096c7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="strand-cyan" x1="500" y1="420" x2="1600" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077b6" stop-opacity="0" />
      <stop offset="14%" stop-color="#0096c7" stop-opacity="0.4" />
      <stop offset="38%" stop-color="#00e5ff" stop-opacity="0.92" />
      <stop offset="62%" stop-color="#0077b6" stop-opacity="0.38" />
      <stop offset="86%" stop-color="#72efdd" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#caf0f8" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="strand-ice" x1="560" y1="120" x2="1600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0" />
      <stop offset="16%" stop-color="#48cae4" stop-opacity="0.4" />
      <stop offset="36%" stop-color="#e0fbfc" stop-opacity="0.96" />
      <stop offset="56%" stop-color="#00b4d8" stop-opacity="0.38" />
      <stop offset="84%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#90e0ef" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="caustic-spec" x1="620" y1="250" x2="1560" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="20%" stop-color="#90e0ef" stop-opacity="0.3" />
      <stop offset="34%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="48%" stop-color="#00e5ff" stop-opacity="0.2" />
      <stop offset="74%" stop-color="#00b4d8" stop-opacity="0.25" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#corners)">
    <!-- Deep Background -->
    <rect width="1600" height="500" fill="url(#bg)" />
    <rect width="1600" height="500" fill="url(#ambient-glow)" />

    <!-- Dimensional translucent ribbons -->
    <g opacity="0.45">
      <path d="M 460 540 C 660 460, 800 50, 1080 120 C 1320 180, 1420 390, 1650 180 L 1650 380 C 1420 510, 1280 280, 1040 240 C 780 190, 680 510, 460 540 Z" fill="url(#veil1)" />
      <path d="M 540 -40 C 740 80, 860 390, 1130 330 C 1360 280, 1450 50, 1650 100 L 1650 270 C 1450 180, 1320 420, 1080 430 C 820 440, 720 140, 540 -40 Z" fill="url(#veil2)" />
      <path d="M 580 490 C 780 390, 890 120, 1140 180 C 1360 230, 1460 360, 1650 140 L 1650 240 C 1460 440, 1340 310, 1100 260 C 850 210, 750 440, 580 490 Z" fill="url(#veil1)" opacity="0.7" />
    </g>

    <!-- Layer 1: Deep Background Strands (Structural Shadow & Wide Sweep) -->
    <g fill="none" stroke="url(#strand-deep)" stroke-linecap="round">
      <path d="M 420 530 C 640 480, 770 10, 1050 85 C 1300 150, 1400 440, 1650 240" stroke-width="2.2" opacity="0.45" />
      <path d="M 435 536 C 652 472, 782 28, 1062 98 C 1310 162, 1408 425, 1650 222" stroke-width="1.6" opacity="0.55" />
      <path d="M 450 542 C 664 464, 794 46, 1074 111 C 1320 174, 1416 410, 1650 204" stroke-width="1.3" opacity="0.65" />
      <path d="M 465 548 C 676 456, 806 64, 1086 124 C 1330 186, 1424 395, 1650 186" stroke-width="1.3" opacity="0.7" />
      <path d="M 480 554 C 688 448, 818 82, 1098 137 C 1340 198, 1432 380, 1650 168" stroke-width="1.5" opacity="0.75" />
      <path d="M 495 560 C 700 440, 830 100, 1110 150 C 1350 210, 1440 365, 1650 150" stroke-width="1.8" opacity="0.75" />
      <path d="M 510 564 C 712 432, 842 118, 1122 163 C 1360 222, 1448 350, 1650 132" stroke-width="1.4" opacity="0.7" />
      <path d="M 525 568 C 724 424, 854 136, 1134 176 C 1370 234, 1456 335, 1650 114" stroke-width="1.2" opacity="0.65" />
      <path d="M 540 572 C 736 416, 866 154, 1146 189 C 1380 246, 1464 320, 1650 96" stroke-width="1.2" opacity="0.6" />
      <path d="M 555 576 C 748 408, 878 172, 1158 202 C 1390 258, 1472 305, 1650 78" stroke-width="1.5" opacity="0.5" />
      <path d="M 570 580 C 760 400, 890 190, 1170 215 C 1400 270, 1480 290, 1650 60" stroke-width="2.0" opacity="0.4" />

      <!-- Counter-flowing Deep Strands -->
      <path d="M 500 -50 C 700 90, 810 430, 1080 390 C 1320 350, 1420 30, 1650 90" stroke-width="2.0" opacity="0.4" />
      <path d="M 516 -44 C 714 98, 824 415, 1094 376 C 1332 336, 1428 48, 1650 108" stroke-width="1.5" opacity="0.55" />
      <path d="M 532 -38 C 728 106, 838 400, 1108 362 C 1344 322, 1436 66, 1650 126" stroke-width="1.3" opacity="0.65" />
      <path d="M 548 -32 C 742 114, 852 385, 1122 348 C 1356 308, 1444 84, 1650 144" stroke-width="1.3" opacity="0.7" />
      <path d="M 564 -26 C 756 122, 866 370, 1136 334 C 1368 294, 1452 102, 1650 162" stroke-width="1.4" opacity="0.75" />
      <path d="M 580 -20 C 770 130, 880 355, 1150 320 C 1380 280, 1460 120, 1650 180" stroke-width="1.6" opacity="0.75" />
      <path d="M 596 -14 C 784 138, 894 340, 1164 306 C 1392 266, 1468 138, 1650 198" stroke-width="1.4" opacity="0.7" />
      <path d="M 612 -8 C 798 146, 908 325, 1178 292 C 1404 252, 1476 156, 1650 216" stroke-width="1.2" opacity="0.6" />
      <path d="M 628 -2 C 812 154, 922 310, 1192 278 C 1416 238, 1484 174, 1650 234" stroke-width="1.5" opacity="0.5" />
    </g>

    <!-- Layer 2: Primary Cyan Wave (Sculptural Toroidal Twist) -->
    <g fill="none" stroke="url(#strand-cyan)" stroke-linecap="round">
      <path d="M 490 480 C 690 420, 800 55, 1055 115 C 1295 170, 1385 430, 1650 265" stroke-width="1.1" opacity="0.5" />
      <path d="M 502 485 C 700 412, 811 70, 1066 126 C 1304 181, 1393 414, 1650 249" stroke-width="1.2" opacity="0.6" />
      <path d="M 514 490 C 710 404, 822 85, 1077 137 C 1313 192, 1401 398, 1650 233" stroke-width="1.3" opacity="0.7" />
      <path d="M 526 495 C 720 396, 833 100, 1088 148 C 1322 203, 1409 382, 1650 217" stroke-width="1.5" opacity="0.8" />
      <path d="M 538 500 C 730 388, 844 115, 1099 159 C 1331 214, 1417 366, 1650 201" stroke-width="1.7" opacity="0.88" />
      <path d="M 550 505 C 740 380, 855 130, 1110 170 C 1340 225, 1425 350, 1650 185" stroke-width="2.0" opacity="0.95" />
      <path d="M 562 510 C 750 372, 866 145, 1121 181 C 1349 236, 1433 334, 1650 169" stroke-width="1.7" opacity="0.9" />
      <path d="M 574 515 C 760 364, 877 160, 1132 192 C 1358 247, 1441 318, 1650 153" stroke-width="1.5" opacity="0.85" />
      <path d="M 586 520 C 770 356, 888 175, 1143 203 C 1367 258, 1449 302, 1650 137" stroke-width="1.4" opacity="0.8" />
      <path d="M 598 525 C 780 348, 899 190, 1154 214 C 1376 269, 1457 286, 1650 121" stroke-width="1.3" opacity="0.75" />
      <path d="M 610 530 C 790 340, 910 205, 1165 225 C 1385 280, 1465 270, 1650 105" stroke-width="1.3" opacity="0.7" />
      <path d="M 622 535 C 800 332, 921 220, 1176 236 C 1394 291, 1473 254, 1650 89" stroke-width="1.4" opacity="0.65" />
      <path d="M 634 540 C 810 324, 932 235, 1187 247 C 1403 302, 1481 238, 1650 73" stroke-width="1.5" opacity="0.6" />
      <path d="M 646 545 C 820 316, 943 250, 1198 258 C 1412 313, 1489 222, 1650 57" stroke-width="1.2" opacity="0.5" />
      <path d="M 658 550 C 830 308, 954 265, 1209 269 C 1421 324, 1497 206, 1650 41" stroke-width="1.0" opacity="0.4" />
    </g>

    <!-- Layer 3: Intersecting Harmonic Wave (Creates Moiré Depth & Folding Envelope) -->
    <g fill="none" stroke="url(#strand-ice)" stroke-linecap="round">
      <path d="M 560 -20 C 735 120, 845 385, 1095 345 C 1325 305, 1420 55, 1650 125" stroke-width="1.0" opacity="0.45" />
      <path d="M 571 -12 C 745 128, 855 370, 1106 333 C 1335 294, 1428 72, 1650 142" stroke-width="1.2" opacity="0.55" />
      <path d="M 582 -4 C 755 136, 865 355, 1117 321 C 1345 283, 1436 89, 1650 159" stroke-width="1.3" opacity="0.65" />
      <path d="M 593 4 C 765 144, 875 340, 1128 309 C 1355 272, 1444 106, 1650 176" stroke-width="1.5" opacity="0.75" />
      <path d="M 604 12 C 775 152, 885 325, 1139 297 C 1365 261, 1452 123, 1650 193" stroke-width="1.8" opacity="0.88" />
      <path d="M 615 20 C 785 160, 895 310, 1150 285 C 1375 250, 1460 140, 1650 210" stroke-width="2.1" opacity="0.95" />
      <path d="M 626 28 C 795 168, 905 295, 1161 273 C 1385 239, 1468 157, 1650 227" stroke-width="1.8" opacity="0.9" />
      <path d="M 637 36 C 805 176, 915 280, 1172 261 C 1395 228, 1476 174, 1650 244" stroke-width="1.5" opacity="0.82" />
      <path d="M 648 44 C 815 184, 925 265, 1183 249 C 1405 217, 1484 191, 1650 261" stroke-width="1.3" opacity="0.75" />
      <path d="M 659 52 C 825 192, 935 250, 1194 237 C 1415 206, 1492 208, 1650 278" stroke-width="1.2" opacity="0.68" />
      <path d="M 670 60 C 835 200, 945 235, 1205 225 C 1425 195, 1500 225, 1650 295" stroke-width="1.2" opacity="0.6" />
      <path d="M 681 68 C 845 208, 955 220, 1216 213 C 1435 184, 1508 242, 1650 312" stroke-width="1.1" opacity="0.52" />
      <path d="M 692 76 C 855 216, 965 205, 1227 201 C 1445 173, 1516 259, 1650 329" stroke-width="1.0" opacity="0.42" />
    </g>

    <!-- Layer 4: Inner Horizon Bridge (Connects the Crests into a Cohesive Torus) -->
    <g fill="none" stroke="url(#strand-cyan)" stroke-linecap="round">
      <path d="M 520 270 C 730 330, 870 150, 1115 215 C 1345 275, 1445 195, 1650 155" stroke-width="1.1" opacity="0.45" />
      <path d="M 535 262 C 742 316, 880 164, 1125 222 C 1353 278, 1452 186, 1650 144" stroke-width="1.3" opacity="0.58" />
      <path d="M 550 254 C 754 302, 890 178, 1135 229 C 1361 281, 1459 177, 1650 133" stroke-width="1.5" opacity="0.7" />
      <path d="M 565 246 C 766 288, 900 192, 1145 236 C 1369 284, 1466 168, 1650 122" stroke-width="1.7" opacity="0.8" />
      <path d="M 580 238 C 778 274, 910 206, 1155 243 C 1377 287, 1473 159, 1650 111" stroke-width="1.5" opacity="0.72" />
      <path d="M 595 230 C 790 260, 920 220, 1165 250 C 1385 290, 1480 150, 1650 100" stroke-width="1.3" opacity="0.6" />
      <path d="M 610 222 C 802 246, 930 234, 1175 257 C 1393 293, 1487 141, 1650 89" stroke-width="1.1" opacity="0.48" />
    </g>

    <!-- Layer 5: Luminous Caustic Ridges (Restrained Glow & Crisp Specular Highlights) -->
    <ellipse cx="1075" cy="210" rx="340" ry="150" fill="url(#core-flare)" />
    <g fill="none" stroke="url(#caustic-spec)" stroke-linecap="round" filter="url(#soft-glow)">
      <path d="M 550 505 C 740 380, 855 130, 1110 170 C 1340 225, 1425 350, 1650 185" stroke-width="2.4" opacity="0.9" />
      <path d="M 615 20 C 785 160, 895 310, 1150 285 C 1375 250, 1460 140, 1650 210" stroke-width="2.2" opacity="0.85" />
      <path d="M 565 246 C 766 288, 900 192, 1145 236 C 1369 284, 1466 168, 1650 122" stroke-width="1.8" opacity="0.75" />
    </g>
    <!-- Ultra-crisp unblurred core filaments for maximum sharpness at all scales -->
    <g fill="none" stroke="url(#caustic-spec)" stroke-linecap="round">
      <path d="M 544 502 C 735 384, 850 122, 1105 165 C 1335 220, 1421 358, 1650 193" stroke-width="1.2" opacity="0.95" />
      <path d="M 609 16 C 780 156, 890 318, 1145 291 C 1370 255, 1456 132, 1650 202" stroke-width="1.2" opacity="0.9" />
    </g>

    <!-- Soft Vignette Shield on Left for Uncompromised Text Legibility -->
    <rect width="1150" height="500" fill="url(#left-vignette)" />

    <!-- Typography (Strictly within x=95..780) -->
    <text x="95" y="228" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="116" font-weight="700" letter-spacing="-2.5">Zhenhao Liu</text>
    <text x="98" y="297" fill="#94b7d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="400" letter-spacing="0.4">Research agents · AI for science</text>
  </g>
</svg>
